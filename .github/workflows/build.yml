---
name: build

'on':
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: linux-x86_64-legacy
    runs-on: ubuntu-latest

    env:
      CMAKE_OPTS: >-
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=custom
        -DTARGET_UARCH_FLAGS=-march=x86-64
        -DUSE_COMPILE_CACHE=ON
        -DWANT_DEBUG_CPACK=ON
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1

    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up environment
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" | tee -a "$GITHUB_ENV"

      - name: Clone fltk
        uses: actions/checkout@v7
        with:
          repository: fltk/fltk
          path: fltk
          ref: 27d991f046bdebb12bfd58f7c05a19f135979c29
          fetch-depth: 1

      - name: Configure winehq
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings

          wget -O - https://dl.winehq.org/wine-builds/winehq.key |
            sudo gpg --dearmor -o /etc/apt/keyrings/winehq-archive.key -

          sudo wget -NP /etc/apt/sources.list.d/ \
            "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"

      - name: Install packages
        run: |
          sudo apt-get update -y

          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-gcc.txt)

          sudo apt-get install -y --install-recommends \
            g++-multilib \
            gcc-multilib \
            winehq-devel \
            wine-devel-dev

          sudo apt-get install -y --install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-fltk.txt)

      - name: Cache ccache data
        uses: actions/cache@v6
        with:
          key: ccache-${{ github.job }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ github.ref }}-
            ccache-${{ github.job }}-
          path: ~/.cache/ccache

      - name: Configure fltk
        run: |
          cmake -S fltk -B fltk/build \
            -DFLTK_BUILD_SHARED_LIBS=ON \
            -DFLTK_BACKEND_WAYLAND=OFF \
            -DFLTK_BACKEND_X11=ON \
            -DFLTK_USE_LIBDECOR_GTK=OFF \
            -DFLTK_BUILD_TEST=OFF \
            -DFLTK_BUILD_GL=OFF

      - name: Install fltk
        run: |
          cmake --build fltk/build
          sudo cmake --install fltk/build --prefix /usr

      - name: Configure
        run: |
          ccache --zero-stats
          source /opt/qt5*/bin/qt5*-env.sh || true

          cmake -S . \
            -B build \
            $CMAKE_OPTS

      - name: Show compiler configuration
        run: |
          echo "=== CMake CPU configuration ==="
          grep -E 'TARGET_UARCH|TARGET_UARCH_FLAGS' \
            build/CMakeCache.txt || true

          echo "=== CMake compiler flags ==="
          grep -E 'CMAKE_(C|CXX)_FLAGS(:|:STRING|:BOOL)' \
            build/CMakeCache.txt || true

          echo "=== Compiler ==="
          cc --version
          c++ --version

          echo "=== CPU ==="
          lscpu

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure -j2

      - name: Package
        run: |
          cmake --build build --target package

      - name: Verify AppImage
        run: |
          file build/lmms-*.AppImage
          ls -lh build/lmms-*.AppImage

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/lmms-*.AppImage

      - name: Upload AppImage to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/lmms-*.AppImage \
            --clobber

      - name: Trim ccache and print statistics
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats
        env:
          CCACHE_MAXSIZE: 500M
