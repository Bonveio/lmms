name: build
'on':
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types:
      - published
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  linux-x86_64:
    name: linux-x86_64-legacy
    runs-on: ubuntu-24.04
    env:
      CMAKE_OPTS: >-
        -DUSE_WERROR=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTARGET_UARCH=custom -DTARGET_UARCH_FLAGS=-march=x86-64 -DUSE_COMPILE_CACHE=ON -DWANT_DEBUG_CPACK=ON
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up build resources
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Clone FLTK
        uses: actions/checkout@v7
        with:
          repository: fltk/fltk
          path: fltk
          ref: 27d991f046bdebb12bfd58f7c05a19f135979c29
          fetch-depth: 1
      - name: Configure WineHQ
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings

          wget -O - https://dl.winehq.org/wine-builds/winehq.key |
            sudo gpg --dearmor -o /etc/apt/keyrings/winehq-archive.key -

          sudo wget -NP /etc/apt/sources.list.d/ \
            "https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources"
      - name: Prepare APT cache
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo mkdir -p /var/lib/apt/lists/partial

          sudo chown -R "$USER":"$USER" \
            /var/cache/apt/archives \
            /var/lib/apt/lists

          sudo chmod -R u+rwX \
            /var/cache/apt/archives \
            /var/lib/apt/lists

          echo 'APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages
      - name: Cache APT packages
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-linux-x86_64-${{ runner.os }}-${{ hashFiles('.github/workflows/deps-ubuntu-24.04-gcc.txt', '.github/workflows/deps-ubuntu-24.04-fltk.txt') }}
          restore-keys: |
            apt-linux-x86_64-${{ runner.os }}-
      - name: Check and install Linux dependencies
        run: |
          set -euo pipefail

          mapfile -t REQUIRED_PACKAGES < <(
            {
              xargs < .github/workflows/deps-ubuntu-24.04-gcc.txt
              printf '%s\n' \
                g++-multilib \
                gcc-multilib \
                winehq-devel \
                wine-devel-dev
              xargs < .github/workflows/deps-ubuntu-24.04-fltk.txt
            } | tr ' ' '\n' | sed '/^$/d' | sort -u
          )

          MISSING_PACKAGES=()

          for package in "${REQUIRED_PACKAGES[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null |
                 grep -q '^install ok installed$'; then
              MISSING_PACKAGES+=("$package")
            fi
          done

          if [ "${#MISSING_PACKAGES[@]}" -eq 0 ]; then
            echo "All required Linux packages are installed."
            echo "Skipping APT installation."
          else
            echo "Missing packages:"
            printf '  %s\n' "${MISSING_PACKAGES[@]}"

            sudo apt-get update -y

            sudo apt-get install -y --no-install-recommends \
              "${MISSING_PACKAGES[@]}"
          fi
      - name: Cache Linux ccache
        uses: actions/cache@v6
        with:
          key: ccache-linux-${{ github.job }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ github.job }}-${{ github.ref }}-
            ccache-linux-${{ github.job }}-
          path: ~/.cache/ccache
      - name: Configure FLTK
        run: |
          cmake -S fltk -B fltk/build \
            -DFLTK_BUILD_SHARED_LIBS=ON \
            -DFLTK_BACKEND_WAYLAND=OFF \
            -DFLTK_BACKEND_X11=ON \
            -DFLTK_USE_LIBDECOR_GTK=OFF \
            -DFLTK_BUILD_TEST=OFF \
            -DFLTK_BUILD_GL=OFF
      - name: Build and install FLTK
        run: |
          cmake --build fltk/build --parallel "$BUILD_JOBS"
          sudo cmake --install fltk/build --prefix /usr
      - name: Configure Linux build
        run: |
          ccache --zero-stats
          source /opt/qt5*/bin/qt5*-env.sh || true

          cmake -S . \
            -B build \
            $CMAKE_OPTS
      - name: Show Linux compiler configuration
        run: |
          echo "=== CMake CPU configuration ==="
          grep -E 'TARGET_UARCH|TARGET_UARCH_FLAGS' \
            build/CMakeCache.txt || true

          echo "=== CMake compiler flags ==="
          grep -E 'CMAKE_(C|CXX)_FLAGS(:|:STRING|:BOOL)' \
            build/CMakeCache.txt || true

          echo "=== Compiler ==="
          cc --version
          c++ --version

          echo "=== CPU ==="
          lscpu

          echo "=== Memory ==="
          free -h
      - name: Build Linux
        run: cmake --build build --parallel "$BUILD_JOBS"
      - name: Run Linux tests
        run: |
          cd build/tests
          ctest --output-on-failure -j2
      - name: Package Linux AppImage
        run: cmake --build build --target package
      - name: Verify Linux AppImage
        run: |
          file build/lmms-*.AppImage
          ls -lh build/lmms-*.AppImage
      - name: Upload Linux workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: lmms-linux-x86_64-legacy
          archive: false
          path: build/lmms-*.AppImage
      - name: Upload Linux AppImage to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/lmms-*.AppImage \
            --clobber
      - name: Trim Linux ccache and print statistics
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats
        env:
          CCACHE_MAXSIZE: 500M
  mingw-x86_64:
    name: windows-x86_64-mingw
    runs-on: ubuntu-24.04
    env:
      CMAKE_OPTS: >-
        -Werror=dev -DUSE_WERROR=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTARGET_UARCH=official -DUSE_COMPILE_CACHE=ON
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up build resources
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Cache vcpkg dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          key: vcpkg-mingw-x86_64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-mingw-x86_64-
          path: build/vcpkg_installed
      - name: Cache MinGW ccache
        uses: actions/cache@v6
        with:
          key: ccache-mingw-${{ github.job }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-mingw-${{ github.job }}-${{ github.ref }}-
            ccache-mingw-${{ github.job }}-
          path: ~/.cache/ccache
      - name: Install MinGW dependencies
        run: |
          sudo .github/workflows/setup-mingw-packages.sh

          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-mingw.txt)
      - name: Configure Windows build
        run: |
          export VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT}"
          echo "VCPKG_ROOT=${VCPKG_ROOT}" >> "$GITHUB_ENV"

          ccache --zero-stats

          cmake -S . \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE="./cmake/toolchains/x64-mingw-vcpkg.cmake" \
            -DVCPKG_MANIFEST_INSTALL="${{ env.should_install_manifest }}" \
            $CMAKE_OPTS
        env:
          should_install_manifest: >-
            ${{ steps.cache-deps.outputs.cache-hit == 'true' && 'NO' || 'YES' }}
      - name: Show Windows compiler configuration
        run: |
          echo "=== CMake CPU configuration ==="
          grep -E 'TARGET_UARCH|TARGET_UARCH_FLAGS' \
            build/CMakeCache.txt || true

          echo "=== CMake compiler ==="
          grep -E 'CMAKE_(C|CXX)_COMPILER(:|:FILEPATH)' \
            build/CMakeCache.txt || true

          echo "=== MinGW compiler ==="
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version

          echo "=== CPU ==="
          lscpu

          echo "=== Memory ==="
          free -h
      - name: Build Windows
        run: cmake --build build --parallel "$BUILD_JOBS"
      - name: Package Windows installer
        run: cmake --build build --target package
      - name: Verify Windows installer
        run: |
          file build/lmms-*.exe
          ls -lh build/lmms-*.exe
      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: lmms-windows-x86_64-mingw
          archive: false
          path: build/lmms-*.exe
      - name: Upload Windows installer to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/lmms-*.exe \
            --clobber
      - name: Trim MinGW ccache and print statistics
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats
        env:
          CCACHE_MAXSIZE: 500M
